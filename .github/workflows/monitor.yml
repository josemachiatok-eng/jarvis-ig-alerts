name: Instagram Story Monitor

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (00:00 / 06:00 / 12:00 / 18:00 UTC)
  workflow_dispatch:         # keep for manual trigger / testing

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 330      # 82 accounts × variable human delay (avg ~65s + breaks) ≈ up to 5.5 h
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run monitor
        env:
          IG_USERNAME:          ${{ secrets.IG_USERNAME }}
          SESSION_B64:          ${{ secrets.SESSION_B64 }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PROXY_URL:            ${{ secrets.PROXY_URL }}
        run: python pipeline/instagram_story_monitor.py
